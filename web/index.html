<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Nemici Miei</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="Nemici Miei: gioco d'avventura isometrico scritto in Rust, giocabile nel browser anche da telefono.">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }
        /* il canvas non deve avere bordi o padding, altrimenti le coordinate del mouse sono sbagliate */
        canvas {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: block;
            position: absolute;
            inset: 0;
            outline: none;
            touch-action: none;
            image-rendering: pixelated;
        }
        #ruota {
            display: none;
            position: fixed;
            left: 0; right: 0; bottom: 12px;
            text-align: center;
            font: 16px sans-serif;
            color: #fad23c;
            pointer-events: none;
        }
        @media (orientation: portrait) and (pointer: coarse) {
            #ruota { display: block; }
        }
    </style>
</head>
<body>
    <canvas id="glcanvas" tabindex="1"></canvas>
    <div id="ruota">Ruota il telefono in orizzontale per giocare meglio</div>
    <script src="mq_js_bundle.js"></script>
    <script>load("nemici-miei.wasm");</script>
</body>
</html>
