# Compila il gioco in WebAssembly (macroquad) e lo pubblica su GitHub Pages:
# https://vincenzoallocca.github.io/nemici-miei/
name: Pubblica il gioco nel browser

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build web (wasm32)
        run: cargo build --locked --release --target wasm32-unknown-unknown
      - name: Prepara la cartella del sito
        run: |
          mkdir -p dist
          cp web/index.html dist/
          cp target/wasm32-unknown-unknown/release/nemici-miei.wasm dist/
          cp -r assets dist/
          curl -fsSL -o dist/mq_js_bundle.js https://not-fl3.github.io/miniquad-samples/mq_js_bundle.js
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
