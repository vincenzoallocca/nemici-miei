# Compila il gioco per il browser con pygbag (WebAssembly) e lo pubblica su GitHub Pages:
# https://vincenzoallocca.github.io/nemici-miei/
name: Pubblica il gioco nel browser

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pygbag==0.9.3
      - name: Build web (pygbag)
        run: python -m pygbag --build --title "Nemici Miei" --width 960 --height 720 --app_name nemici-miei --template web.tmpl .
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
